# Throwaway Odoo 18 for the E2E suite.
#
#   docker compose -f docker-compose.test.yml up -d
#   export ODOO_TEST_URL=http://localhost:18169 ODOO_TEST_DB=e2e \
#          ODOO_TEST_USER=admin ODOO_TEST_PASSWORD=admin
#   pytest cli_anything/odoo/tests/test_full_e2e.py -v
#   docker compose -f docker-compose.test.yml down -v
#
# Ports are deliberately unusual so this never collides with a real Odoo.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    ports:
      - "15442:5432"
    tmpfs:
      - /var/lib/postgresql/data        # RAM only: nothing survives, by design

  odoo:
    image: odoo:18.0
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "18169:8069"
    command: >
      odoo -d e2e -i base --without-demo=all
           --db_host=db --db_user=odoo --db_password=odoo
           --log-level=warn
